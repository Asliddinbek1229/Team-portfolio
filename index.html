<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamDU IT Park · Raqamli universitet</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0a0f" />
    <script>
      // Mavzu birinchi bo'yalishdan oldin qo'yiladi — sahifa ochilganda rang "miltillamaydi" (kalit: src/theme.js)
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('namdu-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var d = document.documentElement
        d.dataset.theme = t
        d.style.colorScheme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#f5f4f0'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
